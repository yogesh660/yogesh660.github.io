<div class="progress" aria-hidden="true"></div>
<article class="case-page">
  <header class="page-head">
    <a class="back rise" style="--d:1" href="/work/">{{i:back}} All work projects</a>
    <span class="tag rise" style="--d:2">{{num}} / {{meta}}</span>
    <h1 class="case-title" style="view-transition-name: case-{{slug}}">{{title}}</h1>
    <p class="lede rise" style="--d:3">{{text}}</p>
  </header>

  <div class="case-body">
    <aside class="glance reveal">
      <dl>
        <dt>Role</dt><dd>{{role}}</dd>
        <dt>Where and when</dt><dd>{{meta}}</dd>
        <dt>Areas</dt><dd>{{areas}}</dd>
        <dt>Stack</dt><dd><div class="chips">{{tags}}</div></dd>
      </dl>
      {{link}}
    </aside>

    <div class="story">
      <section class="reveal">
        <h2 class="h3">What I did</h2>
        <ol class="steps">{{points}}</ol>
      </section>
      {{approach}}
    </div>
  </div>

  <div class="pager" role="navigation" aria-label="More work projects">
    {{prev}}
    {{next}}
  </div>
</article>
